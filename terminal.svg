<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" role="img" aria-labelledby="title desc">
  <title id="title">wh0amitz — profile terminal</title>
  <desc id="desc">A responsive, animated PowerShell-style terminal introducing wh0amitz and summarizing security research and development interests. This is profile artwork, not real system or privilege output.</desc>
  <style>
    .mono { font-family: 'Cascadia Code', 'Consolas', 'Menlo', monospace; font-size: 15px; }
    .ui { font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; }
  </style>
  <defs>
    <clipPath id="command-clip">
      <rect x="0" y="0" width="0" height="24">
        <animate attributeName="width" from="0" to="180" begin="0.4s" dur="1s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <rect width="860" height="370" rx="12" fill="#0c0c0c" />
  <path d="M12 0h836a12 12 0 0 1 12 12v30H0V12A12 12 0 0 1 12 0Z" fill="#1a1a1a" />
  <circle cx="22" cy="21" r="7" fill="#ff5f56" />
  <circle cx="46" cy="21" r="7" fill="#ffbd2e" />
  <circle cx="70" cy="21" r="7" fill="#27c93f" />
  <text x="430" y="26" text-anchor="middle" class="ui" fill="#e6e6e6">PowerShell — Profile</text>

  <text x="24" y="78" class="mono" fill="#3a96dd">PS C:\Users\wh0amitz&gt;</text>
  <g clip-path="url(#command-clip)">
    <text x="245" y="78" class="mono" fill="#ffffff">Get-Profile</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.55s" dur="0.15s" fill="freeze" />
    <text x="24" y="120" class="mono" fill="#61dbfb" font-weight="700">PROFILE</text>
    <text x="24" y="143" class="mono" fill="#d0d0d0">Security research, engineering, and open-source projects</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.85s" dur="0.15s" fill="freeze" />
    <text x="24" y="190" class="mono" fill="#61dbfb" font-weight="700">FOCUS AREAS</text>
    <text x="24" y="213" class="mono" fill="#767676">────────────────────────────────────────────────────────────</text>
    <text x="24" y="242" class="mono" fill="#ffffff">Security research</text>
    <text x="270" y="242" class="mono" fill="#c9d1d9">Web security · Active Directory · Kerberos</text>
    <text x="24" y="270" class="mono" fill="#ffffff">Development</text>
    <text x="270" y="270" class="mono" fill="#c9d1d9">C/C++ · C# · Python · Java · PHP · Node.js</text>
    <text x="24" y="298" class="mono" fill="#ffffff">Tools</text>
    <text x="270" y="298" class="mono" fill="#c9d1d9">Linux · PowerShell · Bash · Git</text>
  </g>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.15s" fill="freeze" />
    <text x="24" y="344" class="mono" fill="#3a96dd">PS C:\Users\wh0amitz&gt;</text>
    <rect x="246" y="331" width="10" height="18" fill="#ffffff">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
